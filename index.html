<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>背背背😡 · 英语生词聚类卡</title>
<style>
  :root{
    --bg:#fbfbfc; --card:#ffffff; --ink:#111827; --sub:#6b7280; --faint:#9aa0ab;
    --line:#eceef1; --line-strong:#e1e4ea;
    --accent:#4f46e5; --accent-soft:#eef0ff;
    --good:#059669; --good-soft:#ecfdf5;
    --bad:#e11d48; --bad-soft:#fff1f2;
    --warn:#b45309; --warn-soft:#fffbeb;
    --radius:16px;
    --shadow-sm:0 1px 2px rgba(17,24,39,.05);
    --shadow:0 1px 3px rgba(17,24,39,.05),0 14px 30px -18px rgba(17,24,39,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 44px;}

  /* 顶部 */
  header{position:sticky;top:0;z-index:20;background:rgba(251,251,252,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .pbar{height:3px;background:var(--line);}
  .pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s cubic-bezier(.2,.7,.2,1);}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px;}
  .brand{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .brand .logo{font-size:17px;line-height:1;}
  .brand .name{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .brand .sub{color:var(--sub);font-size:12px;margin-left:2px;}
  .seg{flex:0 0 auto;display:flex;background:#eef0f4;border-radius:10px;padding:3px;gap:2px;}
  .seg-btn{border:none;background:transparent;border-radius:8px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .18s ease;}
  .seg-btn.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}

  .search{padding:6px 16px 8px;}
  .search input{width:100%;font-size:15px;padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;transition:border-color .2s, box-shadow .2s;}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .16s ease;}
  .chip.on{background:var(--ink);color:#fff;}

  .sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:18px 2px 8px;letter-spacing:.3px;}
  .sec-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink);transition:border-color .15s, transform .12s;}
  .sec-head:active{border-color:var(--line-strong);}
  .sec-head .sh-label{flex:1;}
  .sec-head .sh-count{font-size:12px;color:var(--sub);font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;}
  .sec-head .sh-chev{color:var(--faint);font-size:12px;}

  /* 聚类列表 */
  .cluster{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s, box-shadow .3s, transform .12s;color:var(--ink);animation:rise .28s ease both;}
  .cluster:active{transform:scale(.99);border-color:var(--line-strong);}
  .cluster.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .c-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .c-title{font-size:15.5px;font-weight:700;}
  .c-count{font-size:12px;color:var(--sub);font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;flex:0 0 auto;}
  .c-bar{display:flex;height:4px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:10px;}
  .c-bar i{display:block;height:100%;}
  .c-bar .k{background:var(--good);} .c-bar .w{background:var(--bad);}

  /* 词表 */
  .wgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;animation:rise .26s ease both;}
  .wg-title{font-size:14.5px;font-weight:700;color:var(--ink);}
  .wrow{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15px;}
  .wrow + .wrow{border-top:1px solid var(--line);}
  .wdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#d7dae2;}
  .wdot.k{background:var(--good);} .wdot.w{background:var(--bad);}
  .ww{font-weight:700;color:var(--ink);}
  .wspk{border:none;background:none;font-size:16px;cursor:pointer;padding:1px 2px;color:var(--accent);opacity:.85;}
  .wspk:active{transform:scale(1.2);}
  .wm{flex:1;text-align:right;font-size:13px;color:var(--sub);line-height:1.45;}

  .empty{text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;}

  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .fab{position:fixed;right:18px;bottom:24px;z-index:25;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px 20px;font-size:14.5px;font-weight:700;box-shadow:0 8px 24px -8px rgba(79,70,229,.6);cursor:pointer;transition:transform .15s ease, opacity .25s ease;}
  .fab:active{transform:scale(.95);}
  .fab.hide{opacity:0;pointer-events:none;transform:translateY(10px);}

  /* 学习视图 */
  #study{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:none;}
  #study.show{display:block;}
  .s-bar{position:sticky;top:0;background:rgba(251,251,252,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;z-index:5;display:flex;align-items:center;gap:10px;}
  .back{flex:0 0 auto;border:none;background:transparent;padding:6px 10px;font-size:15px;font-weight:600;color:var(--accent);cursor:pointer;}
  .s-title{flex:1;font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s-prog{flex:0 0 auto;font-size:13px;color:var(--sub);font-weight:600;}

  .s-body{max-width:640px;margin:0 auto;padding:6px 16px 60px;}
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 14px;}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}

  .note-toggle{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;padding:7px 2px;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;text-align:left;}
  .note-toggle .nt-chev{font-size:11px;color:var(--faint);transition:transform .2s;}
  .note-body{font-size:13.5px;color:var(--sub);line-height:1.75;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;}

  .card{position:relative;display:grid;perspective:1200px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);cursor:pointer;min-height:250px;}
  .face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s cubic-bezier(.2,.75,.25,1);}
  .face.front{transform:rotateY(0deg);}
  .face.back{transform:rotateY(180deg);}
  .card.flipped .face.front{transform:rotateY(-180deg);}
  .card.flipped .face.back{transform:rotateY(0deg);}
  .card .w{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.2;word-break:break-word;}
  .card .hint{margin-top:20px;font-size:12.5px;color:var(--faint);}
  .card .w-small{font-size:15px;font-weight:700;color:var(--sub);margin-bottom:14px;word-break:break-word;}
  .card .m{font-size:19px;font-weight:600;color:var(--ink);line-height:1.6;word-break:break-word;text-align:left;}
  .card .tag{font-size:12px;color:var(--faint);margin-bottom:8px;}
  .card .speak{margin-top:22px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s;}
  .card .speak:active{transform:scale(.95);}
  .card .speak.sm{margin:0 0 0 8px;padding:3px 10px;font-size:13px;}

  .actions{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s ease;}
  .btn.no{background:var(--bad-soft);color:var(--bad);}
  .btn.yes{background:var(--good-soft);color:var(--good);}
  .btn.prev{flex:0 0 auto;padding:15px 15px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:600;}
  .btn:active{transform:scale(.96);}
  .kbd{font-size:11px;opacity:.55;font-weight:500;margin-left:4px;}

  .opt{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:13px;color:var(--sub);}
  .opt input{width:16px;height:16px;accent-color:var(--bad);}

  .done{text-align:center;padding:40px 10px;}
  .done .emoji{font-size:52px;}
  .done h2{font-size:20px;margin:14px 0 6px;}
  .done p{color:var(--sub);font-size:14px;margin:0 0 18px;}
  .done .btn{flex:none;width:100%;background:var(--accent);color:#fff;}

  .reset{text-align:center;margin-top:32px;}
  .reset button{background:none;border:none;color:var(--faint);font-size:12px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="home">
  <header>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="top">
      <div class="brand">
        <span class="logo">😡</span>
        <span class="name">背背背</span>
        <span class="sub" id="subtitle"></span>
      </div>
      <div class="seg" id="mode-seg">
        <button class="seg-btn on" data-mode="card">背卡</button>
        <button class="seg-btn" data-mode="list">词表</button>
      </div>
    </div>
    <div class="search"><input id="q" type="text" placeholder="搜索单词、短语或词义"></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div id="list"></div>
  <div class="reset"><button id="reset">清除全部进度</button></div>
</div>

<div id="study">
  <div class="s-bar">
    <button class="back" id="s-back">‹ 返回</button>
    <div class="s-title" id="s-title"></div>
    <div class="s-prog" id="s-prog"></div>
  </div>
  <div class="s-body">
    <div class="bar"><i id="s-bar"></i></div>
    <button class="note-toggle" id="note-toggle">💡 记法<span class="nt-chev">▸</span></button>
    <div class="note-body" id="note-body" style="display:none"></div>
    <div class="card" id="card">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
    <div class="actions">
      <button class="btn prev" id="btn-prev">上一词<span class="kbd">↑</span></button>
      <button class="btn no" id="btn-no">不认识 ✗<span class="kbd">←</span></button>
      <button class="btn yes" id="btn-yes">认识 ✓<span class="kbd">→</span></button>
    </div>
    <div class="opt"><label><input type="checkbox" id="weak-only"> 只看标过「不认识」的词</label></div>
    <div id="s-done" class="done" style="display:none"></div>
  </div>
</div>

<button class="fab hide" id="fab">📍 继续</button>

const LS = 'beici_v1';
const SECT = [['root','词根词缀'],['syn','近义辨析'],['ph','短语动词'],['noun','主题名词']];

let P = (()=>{ try{ const o=JSON.parse(localStorage.getItem(LS)||'{"k":[],"w":[]}'); return {k:new Set(o.k||[]), w:new Set(o.w||[])}; }catch(e){ return {k:new Set(), w:new Set()}; } })();
function save(){ localStorage.setItem(LS, JSON.stringify({k:[...P.k], w:[...P.w]})); }

const LS_UI = 'beici_v1_ui';
let openSec = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem(LS_UI)||'{"open":[]}').open||[]); }catch(e){ return new Set(); } })();
function saveOpen(){ localStorage.setItem(LS_UI, JSON.stringify({open:[...openSec]})); }

const TOTAL = DATA.reduce((n,c)=>n+c.w.length,0);
const allWords = new Set(DATA.flatMap(c=>c.w.map(x=>x.w)));

function statusOf(w){ if(P.k.has(w)) return 'k'; if(P.w.has(w)) return 'w'; return 'n'; }

function stats(){
  let k=0,w=0;
  DATA.forEach(c=>c.w.forEach(x=>{ if(P.k.has(x.w))k++; else if(P.w.has(x.w))w++; }));
  return {k,w,n:TOTAL-k-w};
}

function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function speak(txt){
  try{
    const synth = (typeof window!=='undefined') && window.speechSynthesis;
    if(!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-US'; u.rate = 0.95;
    const voices = synth.getVoices() || [];
    const v = voices.find(x=>/^en/i.test(x.lang) && /us/i.test(x.lang)) || voices.find(x=>/^en/i.test(x.lang));
    if(v) u.voice = v;
    synth.speak(u);
  }catch(e){}
}

/* ---------- 首页 ---------- */
let curSec='all', q='', mode='card'; // mode: card | list

function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  const mk=(label,val,cls)=>{ const b=document.createElement('button'); b.className='chip'+(cls||''); b.textContent=label; if(curSec===val)b.classList.add('on'); b.onclick=()=>{curSec=val;renderTabs();renderList();}; t.appendChild(b); };
  mk('全部','all');
  SECT.forEach(s=>mk(s[1],s[0]));
  const wc = P.w.size;
  mk('不会的词 '+wc,'weak','weak');
}

function renderList(){ if(mode==='list') renderWordList(); else renderClusters(); updateFab(); }

function findNext(){
  const isWeakTab = curSec==='weak';
  const secs = (curSec==='all'||curSec==='weak') ? SECT.map(s=>s[0]) : [curSec];
  const unlearned = c=> c.w.some(x=>statusOf(x.w)==='n');
  const weak = c=> c.w.some(x=>statusOf(x.w)==='w');
  const first = (pred)=>{ for(const sk of secs){ for(const c of DATA){ if(c.s===sk && pred(c)) return c; } } return null; };
  return isWeakTab ? first(weak) : (first(unlearned) || first(weak));
}
function jumpNext(){
  const c = findNext();
  if(!c) return;
  if(curSec==='all' && !q.trim()){ if(!openSec.has(c.s)){ openSec.add(c.s); saveOpen(); } }
  renderList();
  requestAnimationFrame(()=>{
    const el=document.getElementById('cl-'+c.k);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'), 1600); }
  });
}
function updateFab(){
  const fab=document.getElementById('fab');
  const has = (mode==='card') && !!findNext();
  fab.classList.toggle('hide', !has);
}

function renderClusters(){
  const el=document.getElementById('list'); el.innerHTML='';
  const qv=q.trim().toLowerCase();
  let list = DATA;
  if(curSec!=='all' && curSec!=='weak') list=list.filter(c=>c.s===curSec);
  if(qv) list=list.filter(c=> c.t.toLowerCase().includes(qv) || c.n.includes(qv) || c.w.some(x=>x.w.toLowerCase().includes(qv)||x.m.includes(qv)));
  if(curSec==='weak'){
    list = DATA.filter(c=>c.w.some(x=>P.w.has(x.w)));
    if(!qv) list = list.map(c=>({...c, w:c.w.filter(x=>P.w.has(x.w))}));
  }
  if(!list.length){ el.innerHTML='<div class="empty">没有找到相关内容</div>'; return; }

  const groups = (curSec==='all'||curSec==='weak') ? SECT : [[curSec, SECT.find(s=>s[0]===curSec)?.[1]||'']];
  const accordion = (curSec==='all') && !qv;
  for(const [sk,slabel] of groups){
    const gs = list.filter(c=>c.s===sk);
    if(!gs.length) continue;
    if(accordion){
      const open = openSec.has(sk);
      const h=document.createElement('button'); h.className='sec-head';
      h.innerHTML=`<span class="sh-label">${slabel}</span><span class="sh-count">${gs.length} 组</span><span class="sh-chev">${open?'▾':'▸'}</span>`;
      h.onclick=()=>{ open? openSec.delete(sk) : openSec.add(sk); saveOpen(); renderList(); };
      el.appendChild(h);
      if(open) gs.forEach(c=> el.appendChild(clusterEl(c)));
    } else {
      const h=document.createElement('div'); h.className='sec-title'; h.textContent=slabel; el.appendChild(h);
      gs.forEach(c=> el.appendChild(clusterEl(c)));
    }
  }
}

function renderWordList(){
  const el=document.getElementById('list'); el.innerHTML='';
  const qv=q.trim().toLowerCase();
  const weakOnly = (curSec==='weak');
  const secs = [];
  for(const [sk, slabel] of SECT){
    if(curSec!=='all' && curSec!=='weak' && curSec!==sk) continue;
    const clusters = [];
    let wc = 0;
    for(const c of DATA){
      if(c.s!==sk) continue;
      let words = c.w;
      if(weakOnly) words = words.filter(x=>P.w.has(x.w));
      if(qv) words = words.filter(x=>x.w.toLowerCase().includes(qv) || x.m.toLowerCase().includes(qv));
      if(!words.length) continue;
      clusters.push({title:c.t, words});
      wc += words.length;
    }
    if(clusters.length) secs.push({sk, slabel, clusters, wc});
  }
  if(!secs.length){ el.innerHTML='<div class="empty">没有找到相关内容</div>'; return; }

  const accordion = (curSec==='all') && !qv;
  for(const sec of secs){
    if(accordion){
      const open = openSec.has(sec.sk);
      const h=document.createElement('button'); h.className='sec-head';
      h.innerHTML=`<span class="sh-label">${sec.slabel}</span><span class="sh-count">${sec.wc} 词</span><span class="sh-chev">${open?'▾':'▸'}</span>`;
      h.onclick=()=>{ open? openSec.delete(sec.sk) : openSec.add(sec.sk); saveOpen(); renderList(); };
      el.appendChild(h);
      if(!open) continue;
    } else {
      const h=document.createElement('div'); h.className='sec-title'; h.textContent=sec.slabel; el.appendChild(h);
    }
    for(const cl of sec.clusters){
      const g=document.createElement('div'); g.className='wgroup';
      g.innerHTML=`<div class="wg-title">${esc(cl.title)}</div>` +
        cl.words.map(x=>`<div class="wrow" data-w="${esc(x.w)}"><span class="wdot ${statusOf(x.w)}"></span><span class="ww">${esc(x.w)}</span><button class="wspk">🔊</button><span class="wm">${esc(x.m)}</span></div>`).join('');
      g.querySelectorAll('.wspk').forEach(b=>{
        const w=b.closest('.wrow').getAttribute('data-w');
        b.onclick=e=>{ e.stopPropagation(); speak(w); };
      });
      el.appendChild(g);
    }
  }
}

function clusterEl(c){
  let k=0,w=0;
  c.w.forEach(x=>{ const s=statusOf(x.w); if(s==='k')k++; else if(s==='w')w++; });
  const total=c.w.length;
  const pw=v=> total? (v/total*100).toFixed(1)+'%' : '0%';
  const b=document.createElement('button'); b.className='cluster'; b.id='cl-'+c.k;
  b.innerHTML = `<div class="c-top"><span class="c-title">${esc(c.t)}</span><span class="c-count">${total} 词</span></div>
    <div class="c-bar"><i class="k" style="width:${pw(k)}"></i><i class="w" style="width:${pw(w)}"></i></div>`;
  b.onclick=()=>openCluster(c.k);
  return b;
}

function renderStats(){
  const s=stats();
  document.getElementById('subtitle').textContent = `已会 ${s.k} · 不会 ${s.w} · 未学 ${s.n}`;
  document.getElementById('pbar').style.width = (TOTAL? s.k/TOTAL*100 : 0)+'%';
}

/* ---------- 学习视图 ---------- */
let study=null, noteOpen=false;
function openCluster(key){
  const c=DATA.find(x=>x.k===key); if(!c)return;
  study={title:c.t,note:c.n,key:c.k,deck:c.w.map(x=>({w:x.w,m:x.m})),di:0,flipped:false,weakOnly:false,undo:[]};
  document.getElementById('weak-only').checked=false;
  showStudy();
}
function openWeak(){
  const deck=[]; DATA.forEach(c=>c.w.forEach(x=>{ if(P.w.has(x.w)) deck.push({w:x.w,m:x.m}); }));
  shuffle(deck);
  study={title:'不会的词 · 复习',note:'这里只有你标过「不认识」的词，认识一个就少一个，直到清零。',key:null,deck,di:0,flipped:false,weakOnly:false,undo:[]};
  document.getElementById('weak-only').checked=false;
  showStudy();
}
function renderNote(){
  const body=document.getElementById('note-body');
  body.style.display = noteOpen?'block':'none';
  const chev=document.getElementById('note-toggle').querySelector('.nt-chev');
  if(chev) chev.textContent = noteOpen?'▾':'▸';
}
function showStudy(){
  document.getElementById('study').classList.add('show');
  document.getElementById('s-title').textContent=study.title;
  document.getElementById('note-body').textContent=study.note;
  noteOpen=false; renderNote();
  document.getElementById('s-done').style.display='none';
  document.querySelector('.actions').style.display='flex';
  document.getElementById('card').style.display='grid';
  renderCard();
}
function rebuildDeck(){
  if(study.weakOnly){
    if(study.key){ const c=DATA.find(x=>x.k===study.key); study.deck=c.w.filter(x=>P.w.has(x.w)).map(x=>({w:x.w,m:x.m})); }
    else { study.deck=[]; DATA.forEach(c=>c.w.forEach(x=>{ if(P.w.has(x.w)) study.deck.push({w:x.w,m:x.m}); })); shuffle(study.deck); }
  } else {
    if(study.key){ const c=DATA.find(x=>x.k===study.key); study.deck=c.w.map(x=>({w:x.w,m:x.m})); }
  }
  study.di=0; study.flipped=false; study.undo=[];
  if(!study.deck.length){ renderEmpty(); return; }
  document.getElementById('s-done').style.display='none';
  document.querySelector('.actions').style.display='flex';
  document.getElementById('card').style.display='grid';
  renderCard();
}
function renderCard(){
  const total=study.deck.length;
  const cur=study.deck[study.di];
  const card=document.getElementById('card');
  const done=study.di/total*100;
  document.getElementById('s-bar').style.width=done+'%';
  document.getElementById('s-prog').textContent=(study.di+1)+' / '+total;
  card.querySelector('.face.front').innerHTML=`<div class="w">${esc(cur.w)}</div><div class="hint">点一下翻面</div><button class="speak">🔊 发音</button>`;
  card.querySelector('.face.back').innerHTML=`<div class="tag">${esc(study.title)}</div><div class="w-small">${esc(cur.w)} <button class="speak sm">🔊</button></div><div class="m">${esc(cur.m)}</div>`;
  card.classList.toggle('flipped', study.flipped);
  card.querySelectorAll('.speak').forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); speak(cur.w); }; });
  card.onclick=()=>{ study.flipped=!study.flipped; if(study.flipped) speak(cur.w); renderCard(); };
}
function mark(know){
  if(!study || !study.deck.length) return;
  const w=study.deck[study.di].w;
  study.undo.push({w, was:statusOf(w)});
  if(know){ P.k.add(w); P.w.delete(w); } else { P.w.add(w); P.k.delete(w); }
  save();
  study.di++; study.flipped=false;
  if(study.di>=study.deck.length){ renderDone(); } else renderCard();
}
function prev(){
  if(!study || study.di<=0) return;
  const last = study.undo.pop();
  if(last){
    P.k.delete(last.w); P.w.delete(last.w);
    if(last.was==='k') P.k.add(last.w);
    else if(last.was==='w') P.w.add(last.w);
    save();
  }
  study.di--; study.flipped=false;
  document.getElementById('s-done').style.display='none';
  document.querySelector('.actions').style.display='flex';
  document.getElementById('card').style.display='grid';
  renderCard();
}
function renderDone(){
  const s=stats();
  document.getElementById('card').style.display='none';
  document.querySelector('.actions').style.display='none';
  document.getElementById('s-bar').style.width='100%';
  document.getElementById('s-prog').textContent='';
  const d=document.getElementById('s-done'); d.style.display='block';
  d.innerHTML=`<div class="emoji">🎉</div><h2>本组完成</h2>
    <p>目前整体：已会 ${s.k} · 不会 ${s.w} · 未学 ${s.n}</p>
    <button class="btn" onclick="nextGroup()">${study.key? '下一组 →':'返回列表'}</button>`;
}
function renderEmpty(){
  document.getElementById('card').style.display='none';
  document.querySelector('.actions').style.display='none';
  const d=document.getElementById('s-done'); d.style.display='block';
  d.innerHTML=`<div class="emoji">✅</div><h2>这里没有「不会」的词</h2><p>去别的组继续学，或先标一些不认识。</p><button class="btn" onclick="goHome()">返回列表</button>`;
}
function nextGroup(){
  if(!study || !study.key){ goHome(); return; }
  const idx=DATA.findIndex(c=>c.k===study.key);
  if(idx>=0 && idx<DATA.length-1){ openCluster(DATA[idx+1].k); } else goHome();
}
function goHome(){
  document.getElementById('study').classList.remove('show');
  renderStats(); renderTabs(); renderList();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* ---------- 事件 ---------- */
document.getElementById('s-back').onclick=goHome;
document.getElementById('btn-no').onclick=()=>mark(false);
document.getElementById('btn-yes').onclick=()=>mark(true);
document.getElementById('btn-prev').onclick=prev;
document.getElementById('weak-only').onchange=e=>{ study.weakOnly=e.target.checked; rebuildDeck(); };
document.getElementById('q').oninput=e=>{ q=e.target.value; renderList(); };
document.getElementById('reset').onclick=()=>{ if(confirm('确定清除全部进度？')){ P={k:new Set(),w:new Set()}; save(); renderStats(); renderTabs(); renderList(); } };
document.getElementById('note-toggle').onclick=()=>{ noteOpen=!noteOpen; renderNote(); };
document.getElementById('fab').onclick=jumpNext;
document.querySelectorAll('#mode-seg .seg-btn').forEach(b=> b.onclick=()=>setMode(b.dataset.mode));
function setMode(m){ mode=m; document.querySelectorAll('#mode-seg .seg-btn').forEach(b=> b.classList.toggle('on', b.dataset.mode===m)); renderList(); }
document.addEventListener('keydown',e=>{
  if(!document.getElementById('study').classList.contains('show')) return;
  if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); if(study){study.flipped=!study.flipped; if(study.flipped) speak(study.deck[study.di].w); renderCard();} }
  else if(e.key==='ArrowUp'){ e.preventDefault(); prev(); }
  else if(e.key==='ArrowLeft'||e.key==='1'){ mark(false); }
  else if(e.key==='ArrowRight'||e.key==='2'){ mark(true); }
});

/* init */
renderStats(); renderTabs(); renderList();
</script>
</body>
</html>
